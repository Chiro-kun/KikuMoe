name: Build & Release

on:
  push:
    branches:
      - devel
      - main
      - redesign
      - linux-build-opx
    tags:
      - 'v*'
  pull_request:
    branches:
      - devel
      - main
      - redesign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: Lint, Type Check & Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev portaudio19-dev \
            libgl1 libegl1 libdbus-1-3 \
            libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install dev dependencies
        run: poetry install --with dev

      - name: Check code formatting with Ruff
        run: poetry run ruff format --check .

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Type check with Mypy
        run: poetry run python -m mypy

      - name: Run automated test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest -v

  build-linux:
    name: Build Linux AppImage
    needs: [quality-gate]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file wget curl binutils portaudio19-dev \
            libglib2.0-0 libgl1 libegl1 libdbus-1-3 \
            libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install project dependencies
        run: poetry install --only main,build

      - name: Fetch static FFmpeg
        env:
          FFMPEG_TAG: 'autobuild-2026-10-22-13-06'
        run: bash packaging/linux/fetch-ffmpeg.sh

      - name: Build PyInstaller onedir bundle
        run: poetry run python -m PyInstaller --noconfirm --clean kikumoe.spec

      - name: Build AppImage
        run: bash packaging/linux/build-appimage.sh dist/KikuMoe

      - name: Smoke test AppImage
        run: |
          chmod +x dist/*.AppImage
          QT_QPA_PLATFORM=offscreen timeout 20 dist/*.AppImage --appimage-extract-and-run --version

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: KikuMoe-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows Executable & Portable ZIP
    needs: [quality-gate]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install project dependencies
        run: poetry install --only main,build

      - name: Download libmpv-2.dll on the fly
        shell: pwsh
        run: |
          $mpvUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261020/mpv-dev-x86_64-20261020-git-6a262d11f6.7z"
          $expectedHash = "d16ea67bcc46d4ee9170f05b322d7184768f216f458bef089c3397a6beaff83e"
          Write-Host "Downloading $mpvUrl..."
          Invoke-WebRequest -Uri $mpvUrl -OutFile mpv-dev.7z
          $actualHash = (Get-FileHash -Path mpv-dev.7z -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
              Write-Error "SHA256 mismatch for mpv-dev.7z! Expected $expectedHash, got $actualHash"
              exit 1
          }
          7z e mpv-dev.7z -o"packaging\windows" libmpv-2.dll -r -y
          Remove-Item mpv-dev.7z -Force

      - name: Build PyInstaller executable
        run: poetry run python -m PyInstaller --noconfirm --clean kikumoe.spec

      - name: Package Windows portable ZIP
        shell: pwsh
        run: |
          $appVersion = (Get-Content version.yml | Select-String -Pattern 'version:\s*(.+)').Matches.Groups[1].Value.Trim()
          $zipDir = "dist\KikuMoe-$appVersion-Windows-x64"
          New-Item -ItemType Directory -Path $zipDir -Force | Out-Null
          Copy-Item "dist\KikuMoe-$appVersion.exe" -Destination "$zipDir\KikuMoe.exe"
          Copy-Item "FFMPEG.bat" -Destination "$zipDir\FFMPEG.bat"
          Copy-Item "README.md" -Destination "$zipDir\README.md"
          Copy-Item "CHANGELOG.md" -Destination "$zipDir\CHANGELOG.md"
          Copy-Item "LICENSE" -Destination "$zipDir\LICENSE"
          Compress-Archive -Path "$zipDir\*" -DestinationPath "dist\KikuMoe-$appVersion-Windows-x64.zip" -Force

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: KikuMoe-Windows-ZIP
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KikuMoe-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [quality-gate, build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release tag matches version.yml
        run: |
          APP_VER="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' version.yml | head -1)"
          EXPECTED_TAG="v${APP_VER}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "ERROR: Git tag '${GITHUB_REF_NAME}' does not match version.yml expected tag '${EXPECTED_TAG}'" >&2
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
