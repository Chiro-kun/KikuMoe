name: Build & Release

on:
  push:
    branches:
      - devel
      - main
      - redesign
    tags:
      - 'v*'
  pull_request:
    branches:
      - devel
      - main
      - redesign
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev ffmpeg file wget portaudio19-dev \
            libglib2.0-0 libgl1 libegl1 \
            libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry & project dependencies
        run: |
          pip install poetry
          poetry install --with dev

      - name: Build PyInstaller binary
        run: poetry run python -m PyInstaller --noconfirm --clean kikumoe.spec

      - name: Build AppImage
        run: bash packaging/linux/build-appimage.sh

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: KikuMoe-Linux-AppImage
          path: dist/*.AppImage

  build-windows:
    name: Build Windows Executable & Portable ZIP
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install project dependencies
        run: poetry install --with dev

      - name: Download libmpv-2.dll on the fly
        shell: pwsh
        run: |
          $mpvUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261020/mpv-dev-x86_64-20261020-git-6a262d11f6.7z"
          Write-Host "Downloading $mpvUrl..."
          Invoke-WebRequest -Uri $mpvUrl -OutFile mpv-dev.7z
          7z e mpv-dev.7z -o"packaging\windows" libmpv-2.dll -r -y
          Remove-Item mpv-dev.7z -Force

      - name: Build PyInstaller executable
        run: poetry run python -m PyInstaller --noconfirm --clean kikumoe.spec

      - name: Package Windows portable ZIP
        shell: pwsh
        run: |
          $appVersion = (Get-Content version.yml | Select-String -Pattern 'version:\s*(.+)').Matches.Groups[1].Value.Trim()
          $zipDir = "dist\KikuMoe-$appVersion-Windows-x64"
          New-Item -ItemType Directory -Path $zipDir -Force | Out-Null
          Copy-Item "dist\KikuMoe-$appVersion.exe" -Destination "$zipDir\KikuMoe.exe"
          Copy-Item "FFMPEG.bat" -Destination "$zipDir\FFMPEG.bat"
          Copy-Item "README.md" -Destination "$zipDir\README.md"
          Copy-Item "CHANGELOG.md" -Destination "$zipDir\CHANGELOG.md"
          Copy-Item "LICENSE" -Destination "$zipDir\LICENSE"
          Compress-Archive -Path "$zipDir\*" -DestinationPath "dist\KikuMoe-$appVersion-Windows-x64.zip" -Force

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: KikuMoe-Windows-ZIP
          path: dist/*.zip

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KikuMoe-Windows-EXE
          path: dist/*.exe

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
