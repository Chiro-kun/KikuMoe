name: Build

on:
  push:
    branches:
      - devel
      - main
      - redesign
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: docker
    container:
      image: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libmpv-dev ffmpeg file wget portaudio19-dev \
            libglib2.0-0 libgl1 libegl1 libdbus-1-3 \
            libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Poetry & project deps
        run: |
          pip install poetry
          poetry install --with dev

      - name: Download static ffmpeg on the fly
        run: |
          FFMPEG_URL="https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          echo "Downloading static ffmpeg from $FFMPEG_URL..."
          wget -q "$FFMPEG_URL" -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz --wildcards '*/bin/ffmpeg' --strip-components=2
          mv ffmpeg packaging/linux/ffmpeg
          chmod +x packaging/linux/ffmpeg
          rm -f ffmpeg.tar.xz

      - name: Build PyInstaller binary
        run: poetry run python -m PyInstaller --noconfirm --clean kikumoe.spec

      - name: Build AppImage
        run: bash packaging/linux/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v3
        with:
          name: KikuMoe-Linux-AppImage
          path: dist/*.AppImage

  release:
    needs: [build-linux]
    runs-on: docker
    container:
      image: node:20-bookworm-slim
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v3

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KikuMoe-Linux-AppImage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

