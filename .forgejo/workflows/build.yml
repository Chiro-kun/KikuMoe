name: Build

on:
  push:
    branches:
      - devel
      - main
      - redesign
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: docker
    container:
      image: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libmpv-dev ffmpeg file wget \
            libglib2.0-0 libgl1 libegl1 \
            libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6

      - name: Install Poetry & project deps
        run: |
          pip install poetry
          poetry install --with dev

      - name: Build PyInstaller binary
        run: poetry run python -m PyInstaller --noconfirm --clean kikumoe.spec

      - name: Build AppImage
        run: bash packaging/linux/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v3
        with:
          name: KikuMoe-Linux-AppImage
          path: dist/*.AppImage

  release:
    needs: [build-linux]
    runs-on: docker
    container:
      image: node:20-bookworm-slim
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v3

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KikuMoe-Linux-AppImage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

