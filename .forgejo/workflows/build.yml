name: Build

on:
  push:
    branches:
      - devel
      - main
      - redesign
      - linux-build-opx
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: docker
    container:
      image: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libmpv-dev file wget curl binutils portaudio19-dev \
            libglib2.0-0 libgl1 libegl1 libdbus-1-3 \
            libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Poetry & project deps
        run: |
          pip install poetry==2.5.1
          poetry install --only main,build

      - name: Fetch static FFmpeg
        env:
          FFMPEG_TAG: 'autobuild-2026-10-22-13-06'
        run: bash packaging/linux/fetch-ffmpeg.sh

      - name: Build PyInstaller onedir bundle
        run: poetry run python -m PyInstaller --noconfirm --clean kikumoe.spec

      - name: Build AppImage
        run: bash packaging/linux/build-appimage.sh dist/KikuMoe

      - name: Smoke test AppImage
        run: |
          chmod +x dist/*.AppImage
          QT_QPA_PLATFORM=offscreen timeout 20 dist/*.AppImage --appimage-extract-and-run --version

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: KikuMoe-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: [build-linux]
    runs-on: docker
    container:
      image: node:20-bookworm-slim
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches version.yml
        run: |
          APP_VER="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' version.yml | head -1)"
          EXPECTED_TAG="v${APP_VER}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "ERROR: Git tag '${GITHUB_REF_NAME}' does not match version.yml expected tag '${EXPECTED_TAG}'" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.AppImage
            release-artifacts/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
